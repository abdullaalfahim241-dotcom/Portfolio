<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent Successfully</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
            padding: 20px;
        }

        .success-box {
            width: 100%;
            max-width: 550px;

            background: white;

            padding: 50px 30px;

            text-align: center;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

            border-top: 5px solid #c0392b;
        }

        .success-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-block;

            padding: 14px 30px;

            background: #c0392b;
            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;
        }

        .back-btn:hover {
            background: #962d22;
            transform: translateY(-2px);
        }

    </style>

</head>


<body>

    <div class="success-box">

        <div class="success-icon">
            ✅
        </div>

        <h1>Message Sent Successfully!</h1>

        <p>
            Thank you for contacting me.
            I have received your message and will get back to you soon.
        </p>

        <a href="index.html" class="back-btn">
            BACK TO HOME
        </a>

    </div>

</body>

</html>
